name: Build and Push Docker Image

on:
  push:
    branches:
      - metasync-internal-chat

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alex2liv/chatwoot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alex2liv/chatwoot:latest
            ghcr.io/alex2liv/chatwoot:metasync-v4.14.0
